<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Arcade Runner Event</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Progressive Web App (PWA) Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" id="meta-theme-color" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <meta name="description" content="Retro 2D endless runner arcade game featuring jumping mechanics, coin collecting, high scores, and witty roast companion." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neon Runner" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
</head>
<body>

  <div id="app-container">
    <div id="game-wrapper">
      <!-- UI HUD -->
      <div id="hud">
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">High Score: <span id="high-score">0</span></div>
        <div class="stat">Coins: <span id="coins">0</span></div>
        <!-- BUG 1: The pause button just refreshes the page instead of pausing! -->
        <button onclick="gameRunning = !gameRunning; if(gameRunning) gameLoop();" id="pause-btn" class="hidden">Pause</button>
        <button id="greedbot-btn" title="Hire GreedBot for 2 coins (Press B)">🤖 Shield (2🪙)</button>
        <!-- Theme Toggle Button -->
        <!-- BUG 2: In White Mode, HUD text remains white on white background! -->
        <button id="theme-btn" title="Toggle Dark / White Mode">☀️ White Mode</button>
        <!-- PWA Install Button -->
        <button id="install-btn" class="hidden" title="Install Neon Runner as a Desktop or Mobile App">📥 Install App</button>
        <!-- Offline Status Badge -->
        <div id="offline-badge" class="hidden" title="Running in Offline PWA Mode">⚡ Offline</div>
      </div>

      <!-- GreedBot Floating Companion -->
      <div id="greedbot-box" class="hidden">
        <div id="greedbot-avatar" title="GreedBot - Click to hire!">
          <svg viewBox="0 0 32 32" width="40" height="40" shape-rendering="crispEdges">
            <rect x="15" y="2" width="2" height="4" fill="#00ffff" />
            <rect x="14" y="0" width="4" height="2" fill="#ff0055" />
            <rect x="8" y="6" width="16" height="14" fill="#2d3748" />
            <rect x="10" y="8" width="12" height="10" fill="#1a202c" />
            <rect class="bot-eye" x="11" y="10" width="3" height="3" fill="#00ffcc" />
            <rect class="bot-eye" x="18" y="10" width="3" height="3" fill="#00ffcc" />
            <rect x="13" y="15" width="6" height="2" fill="#ffd700" />
            <rect x="5" y="10" width="3" height="6" fill="#4a5568" />
            <rect x="24" y="10" width="3" height="6" fill="#4a5568" />
            <rect x="12" y="20" width="8" height="3" fill="#4a5568" />
            <polygon class="bot-thruster" points="13,23 19,23 16,30" fill="#ffaa00" />
          </svg>
        </div>
        <div id="greedbot-dialogue">
          <div id="greedbot-msg">"2 coins for a 5s shield!"</div>
          <div class="greedbot-actions">
            <button id="greedbot-pay-btn">Pay 2🪙</button>
            <button id="greedbot-dismiss-btn">Dismiss</button>
          </div>
        </div>
      </div>

      <!-- Start Screen Overlay -->
      <div id="start-screen" class="overlay">
        <h1>NEON RUNNER</h1>
        <p class="controls-hint">Tap screen or press Space / Up to jump</p>
        <button id="start-btn">Start Game</button>
      </div>

      <!-- Game Over Overlay -->
      <div id="game-over-screen" class="overlay hidden">
        <h1>GAME OVER</h1>
        <button id="restart-btn">Try Again</button>
      </div>

      <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <!-- Small Roasting & Hint Horse Mascot -->
    <div id="horse-box">
      <div id="horse-avatar" title="Click me for a roast & hint!">
        <!-- 8-Bit Pixel Art SVG Horse -->
        <svg id="horse-svg" viewBox="0 0 64 64" width="70" height="70" shape-rendering="crispEdges">
          <!-- Mane -->
          <rect x="22" y="12" width="8" height="18" fill="#2d1406" />
          <rect x="18" y="20" width="6" height="14" fill="#2d1406" />
          <!-- Left Ear -->
          <rect x="30" y="6" width="5" height="8" fill="#6d3210" />
          <rect x="32" y="8" width="3" height="4" fill="#ffb6c1" />
          <!-- Right Ear -->
          <rect x="38" y="6" width="5" height="8" fill="#6d3210" />
          <!-- Head -->
          <rect x="28" y="14" width="18" height="16" fill="#8b4513" />
          <!-- Muzzle / Snout -->
          <rect x="42" y="20" width="10" height="12" fill="#d2a679" />
          <rect x="48" y="27" width="3" height="3" fill="#2d1406" /> <!-- Nostril -->
          <rect x="38" y="16" width="3" height="12" fill="#ffffff" /> <!-- White Blaze -->
          <!-- Eye -->
          <rect x="34" y="18" width="5" height="5" fill="#000000" />
          <rect x="35" y="18" width="2" height="2" fill="#ffffff" /> <!-- Twinkle -->
          <!-- Neck -->
          <rect x="24" y="26" width="12" height="12" fill="#8b4513" />
          <!-- Body -->
          <rect x="10" y="32" width="26" height="16" fill="#8b4513" />
          <!-- Saddle / Blanket -->
          <rect x="18" y="32" width="10" height="8" fill="#ff0055" />
          <rect x="20" y="34" width="6" height="4" fill="#ffd700" />
          <!-- Tail -->
          <rect x="4" y="34" width="7" height="6" fill="#2d1406" />
          <rect x="2" y="40" width="6" height="10" fill="#2d1406" />
          <!-- Legs -->
          <rect x="12" y="48" width="4" height="10" fill="#8b4513" />
          <rect x="12" y="58" width="4" height="3" fill="#2d1406" /> <!-- Hoof -->
          <rect x="18" y="48" width="4" height="10" fill="#6d3210" />
          <rect x="18" y="58" width="4" height="3" fill="#2d1406" />
          <rect x="26" y="48" width="4" height="10" fill="#8b4513" />
          <rect x="26" y="58" width="4" height="3" fill="#2d1406" />
          <rect x="32" y="48" width="4" height="10" fill="#6d3210" />
          <rect x="32" y="58" width="4" height="3" fill="#2d1406" />
        </svg>
      </div>
      <div id="horse-dialogue">
        <div class="horse-header">
          <span class="horse-title">🐴 ROAST HORSE</span>
          <span class="horse-sub">HINT & ROAST COMPANION</span>
        </div>
        <p id="horse-message">"Neigh! Press Space to jump. Try not to crash into the first block like last time."</p>
        <button id="horse-poke-btn">Poke for Hint 🎲</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
